<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCADAGuard — Connexion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page-connexion">
    <div class="panneau-gauche">
      <div class="icone">🛡️</div>
      <h1>SCADAGuard</h1>
      <p class="sous-titre">ONEE — Branche Eau</p>
      <div class="fonctionnalite">🗂️&nbsp;&nbsp;Surveillance des fichiers</div>
      <div class="fonctionnalite">🌐&nbsp;&nbsp;Surveillance réseau</div>
      <div class="fonctionnalite">⚙️&nbsp;&nbsp;Surveillance des processus</div>
      <div class="fonctionnalite">💾&nbsp;&nbsp;Surveillance des périphériques USB</div>
    </div>

    <div class="panneau-droit">
      <form class="carte-connexion" method="POST" action="{{ url_for('connexion') }}">
        <h2>Connexion</h2>

        {% if erreur %}
          <div class="message-erreur">{{ erreur }}</div>
        {% endif %}

        <label for="utilisateur">Nom d'utilisateur</label>
        <input type="text" id="utilisateur" name="utilisateur" autocomplete="username" autofocus>

        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password">

        <button type="submit" class="bouton-primaire">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
